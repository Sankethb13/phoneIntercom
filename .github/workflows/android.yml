
name: Android CI - Build APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant permission to Gradle wrapper
        run: chmod +x Intercom/gradlew

      - name: Build Debug APK
        working-directory: ./Intercom
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneIntercom-APK
          path: Intercom/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
