name: Build Intercom APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intercom-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.INTERCOM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.INTERCOM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INTERCOM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INTERCOM_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "INTERCOM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTERCOM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTERCOM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set. Signing with a throwaway CI key (fine for testing; updates need the same key)."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -alias intercom -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Intercom CI" -noprompt
            echo "::add-mask::$PW"
            echo "INTERCOM_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "INTERCOM_KEY_ALIAS=intercom" >> "$GITHUB_ENV"
            echo "INTERCOM_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "INTERCOM_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: intercom-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: intercom-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
